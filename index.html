<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Presensi Guru</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #f0f2f5;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; color: #1a73e8; font-size: 20px; }
    #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-top: 10px; }
    
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .modal-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-icon { font-size: 48px; margin-bottom: 10px; }
    .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    .modal-desc { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.4; }
    
    .btn-group { display: flex; gap: 10px; justify-content: center; }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary { background: #1a73e8; color: white; }
    .btn-danger { background: #d93025; color: white; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    
    .toast-process {
      margin-top: 15px;
      font-size: 13px;
      color: #666;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Presensi Barcode Guru</h2>
    <div id="reader"></div>
    <div id="processing" class="toast-process">Memproses kode barcode...</div>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal-card">
      <div id="modal-icon" class="modal-icon"></div>
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-desc" class="modal-desc"></div>
      <div id="modal-actions" class="btn-group"></div>
    </div>
  </div>

  <script>
    // MASUKKAN URL HASIL DEPLOY APPS SCRIPT DI SINI
    const API_URL = "MASUKKAN_URL_WEB_APP_ANDA_DI_SINI";

    let isScanningPaused = false;
    let pendingEarlyId = null;

    function showModal(icon, title, desc, buttonsHtml) {
      document.getElementById('modal-icon').innerHTML = icon;
      document.getElementById('modal-title').innerHTML = title;
      document.getElementById('modal-desc').innerHTML = desc;
      document.getElementById('modal-actions').innerHTML = buttonsHtml;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      document.getElementById('processing').style.display = 'none';
      setTimeout(() => {
        isScanningPaused = false;
      }, 1500);
    }

    async function sendDataToSheets(id, forceEarly) {
      const response = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ id: id, forceEarly: forceEarly })
      });
      return await response.json();
    }

    function confirmEarlyLeave() {
      if (!pendingEarlyId) return;
      document.getElementById('processing').style.display = 'block';
      document.getElementById('processing').innerText = 'Menyimpan konfirmasi pulang awal...';
      document.getElementById('modal').style.display = 'none';

      sendDataToSheets(pendingEarlyId, true)
        .then(res => {
          showModal('🚪', 'Pulang Awal Tercatat', res.nama + '<br>' + res.message, 
            '<button class="btn btn-primary" onclick="closeModal()">OK</button>'
          );
        })
        .catch(err => {
          showModal('❌', 'Gagal', err.message, '<button class="btn btn-secondary" onclick="closeModal()">Tutup</button>');
        });
    }

    function onScanSuccess(decodedText) {
      if (isScanningPaused) return;
      isScanningPaused = true;

      document.getElementById('processing').style.display = 'block';
      document.getElementById('processing').innerText = 'Memvalidasi ID: ' + decodedText + '...';

      sendDataToSheets(decodedText, false)
        .then(res => {
          document.getElementById('processing').style.display = 'none';

          if (!res.success) {
            showModal('⚠️', 'Perhatian', res.message, 
              '<button class="btn btn-secondary" onclick="closeModal()">Tutup</button>'
            );
            return;
          }

          if (res.type === 'ON_TIME') {
            showModal('🌟', 'Hadir Tepat Waktu', 
              '<strong>' + res.nama + '</strong> (' + res.waktu + ')<br><br>' + res.message,
              '<button class="btn btn-primary" onclick="closeModal()">Selesai</button>'
            );
          } else if (res.type === 'LATE') {
            showModal('⏰', 'Peringatan Terlambat', 
              '<strong>' + res.nama + '</strong> (' + res.waktu + ')<br><br>' + res.message,
              '<button class="btn btn-danger" onclick="closeModal()">Saya Mengerti</button>'
            );
          } else if (res.type === 'EARLY_CONFIRMATION') {
            pendingEarlyId = res.id;
            showModal('❓', 'Konfirmasi Pulang Cepat', 
              '<strong>' + res.nama + '</strong><br><br>' + res.message,
              '<button class="btn btn-danger" onclick="confirmEarlyLeave()">Ya, Pulang</button>' +
              '<button class="btn btn-secondary" onclick="closeModal()">Batal</button>'
            );
          } else if (res.type === 'CHECKOUT_SUCCESS') {
            showModal('✅', 'Presensi Pulang Selesai', 
              '<strong>' + res.nama + '</strong> (' + res.waktu + ')<br><br>' + res.message,
              '<button class="btn btn-primary" onclick="closeModal()">Tutup</button>'
            );
          }
        })
        .catch(err => {
          document.getElementById('processing').style.display = 'none';
          showModal('❌', 'Kesalahan Sistem', 'Gagal terhubung ke spreadsheet: ' + err.message, 
            '<button class="btn btn-secondary" onclick="closeModal()">Tutup</button>'
          );
        });
    }

    // Kamera langsung otomatis menyala di GitHub Pages
    const scanner = new Html5QrcodeScanner("reader", { 
      fps: 10, 
      qrbox: { width: 250, height: 250 } 
    }, false);
    scanner.render(onScanSuccess);
  </script>
</body>
</html>
